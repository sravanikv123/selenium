# Path to your step definition package
cucumber.glue=StepDefinitions,hooks

# The tags you want to filter and run
cucumber.filter.tags=@sanity

# Enables clean, readable console logs and reports
cucumber.plugin=pretty, html:target/cucumber-reports/report.html,json:target/cucumber-reports/cucumber.json,junit:target/cucumber-reports/cucumber.xml,io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

